<!DOCTYPE html>
<html lang="en" role="meatadata">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
  </style>
</head>
<body>
    <div class="container" role="SocialProfile">
      <img src="./assets/images/avatar-jessica.jpeg" alt="">
       <h1 role="name">Jessica Randall</h1>
        <p class="london">London , United Kingdom</p>
        <p>Front-end developer and avid reader</p>
        <section class="linkSocial">
          <button type="button">GitHub</button>
          <button type="button">frontend Mentor</button>
          <button type="button">LinkedIn</button>
          <button type="button">Twitter</button>
          <button type="button">Instagram</button>
        </section>
    </div>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
